<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Task Manager</h1>
      <p>Student ID: <span id="student-id">73745</span></p>
      <a id="contribution-link" href="contribution.html">Team Contribution</a>
    </header>

    <form id="task-form">
      <input id="task-title" type="text" placeholder="Task title" required>
      <textarea id="task-description" placeholder="Description (optional)"></textarea>
      <div class="form-buttons">
        <button id="task-submit" type="submit">Add task</button>
        <button id="task-cancel" type="button" hidden>Cancel</button>
      </div>
    </form>

    <p id="status-message" role="status"></p>

    <div id="task-list"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
